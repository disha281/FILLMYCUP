<body><main id="app" class="app"></main><script>
var brainResources=[];

const ideas={Creativity:['Make an origami creation','Draw with your non-dominant hand','Create a tiny collage from packaging','Write a ridiculous six-line poem','Design your dream room','Make a bookmark','Create a tiny comic','Decorate something you own','Take five artistic photos of ordinary things','Invent a postcard from today'],Learn:['Learn five words in a new language','Watch a short educational video','Read ten pages of something curious','Learn one interesting fact about space','Try a new computer shortcut','Look up the history of your neighborhood','Listen to a mini podcast episode','Learn to identify a bird near you','Read one long-form article','Watch a beginner tutorial'],Wellness:['Take a phone-free fifteen-minute walk','Stretch slowly for ten minutes','Drink water and sit quietly for five','Do a short breathing exercise','Make yourself a nice drink','Take a screen-free break','Put on calming music and lie down','Write three kind sentences to yourself','Have a warm shower','Step outside and notice the air'],Move:['Do a five-minute dance break','Try a gentle mobility flow','Walk around the block','Do ten slow squats','Put on one song and move freely','Try a beginner yoga video','Climb stairs for five minutes','Do a wall stretch','Take a scenic walking route','Practice balancing on one foot'],Fun:['Listen to an album you have never heard','Watch a comfort episode','Play a small game','Make a ridiculous playlist','Try a new snack combination','Watch funny animal videos guilt-free','Do a crossword or word puzzle','Browse old childhood photos','Try a silly online quiz','Make a blanket nest'],Social:['Send a voice note to someone you miss','Ask a friend one curious question','Send a meme that made you laugh','Write a tiny thank-you text','Call a family member for ten minutes','Recommend something you love','Reply to an old message warmly','Plan a low-effort catch-up','Tell someone a specific compliment','Share a photo from your day'],Life:['Water one plant or tidy its corner','Clear one tiny surface','Make your bed feel extra inviting','Put away five things','Open a window and refresh a room','Organize one drawer for ten minutes','Make a cozy corner','Plan tomorrow’s easy breakfast','Light a candle and reset the room','Do one small errand you have avoided']};
const extras={
Creativity:['Fold an origami crane','Press flowers between book pages','Draw your dream bedroom','Make homemade bookmarks','Learn a magic trick','Make friendship bracelets','Sketch your coffee mug','Write a poem about today','Make a tiny scrapbook page','Practice calligraphy','Draw with one continuous line','Paint with watercolors','Decorate your journal cover','Write your own fairy tale','Doodle without lifting your pen','Make tiny paper flowers','Invent a board game','Create sticky-note art','Create a personal logo','Design your dream café menu'],
Learn:['Learn basic sign language','Solve a crossword puzzle','Solve Sudoku','Learn to solve a Rubik’s Cube','Learn one card trick','Learn one simple dance move','Learn your birth constellation','Learn basic astronomy facts','Learn one psychology fact','Learn about a new country','Learn Morse code','Watch a documentary','Memorize an inspiring quote','Memorize one constellation','Identify three trees','Name every bird you see today','Read one chapter of a book','Read a random Wikipedia article','Learn to whistle with your fingers'],
Wellness:['Watch the sunrise','Watch the sunset','Listen to instrumental music','Listen to rain sounds','Go on a silent walk','Stargaze','Watch clouds and invent stories','Practice mindful breathing','Water your plants','Sit outside for fifteen minutes','Drink a new tea','Make hot chocolate','Make homemade lemonade','Find shapes in the clouds','Watch ants for five minutes','Start a gratitude jar','Write one thing you’re grateful for','Create a happiness playlist','Build a blanket fort','Create a tiny terrarium'],
Life:['Write a letter to your future self','Start a one-line journal','Make a vision board','Write a bucket list','Create a time capsule','Write a thank-you note','Create your personal motto','Write your perfect day schedule','Start a Things That Made Me Smile list','Write a six-word story','Write a short mystery story','Imagine life before the internet','Create a playlist for your dream life','Make a playlist for your future self','Read old family photo albums','Organize your camera roll','Rearrange your room','Organize your desk','Read one chapter of a favorite book','Write down fifty things you love'],
Fun:['Dance to one full song','Learn to juggle with socks','Build a LEGO creation','Build a house of cards','Make paper stars','Make a paper snowflake','Create a mini photo challenge','Draw your pet as a superhero','Bake cookies','Try a new recipe','Spin a pen','Balance a spoon on your nose','Solve a puzzle','Rearrange your bookshelf by color','Write with your non-dominant hand','Watch birds in your neighborhood','Try a ten-minute yoga session','Create a comic strip','Make a paper airplane competition','Spend an hour completely phone-free']
};
Object.entries(extras).forEach(([category,activities])=>activities.forEach(title=>{if(!ideas[category].some(existing=>existing.toLowerCase()===title.toLowerCase()))ideas[category].push(title)}));
const durations=[20,10,15,5,30,10,20,15,10,60]; const diffs=['Easy','Easy','Easy','Tiny','Easy','Easy','Easy','Easy','Easy','Easy'];
const seed=Object.entries(ideas).flatMap(([category,list])=>list.map((title,i)=>({id:'seed-'+category+'-'+i,title,description:description(title,category),category,estimatedDuration:durations[i%durations.length],difficulty:diffs[i%diffs.length]})));
function description(t,c){const extras={Creativity:'No masterpiece needed—just make a small, playful thing.',Learn:'Follow your curiosity for a little while and notice what sticks.',Wellness:'A gentle reset is still a lovely thing to give yourself.',Move:'Keep it light, comfortable, and completely at your own pace.',Fun:'This one has no purpose except making the moment more enjoyable.',Social:'A small connection can make an ordinary day feel warmer.',Life:'A tiny act of care can make your space feel a little more yours.'};return extras[c]}
const store={get(k,d){try{return JSON.parse(localStorage.getItem('fmc-'+k))??d}catch{return d}},set(k,v){localStorage.setItem('fmc-'+k,JSON.stringify(v))}};
let state={page:'home',cat:null,activity:null,revealed:false,time:null,month:new Date(new Date().getFullYear(),new Date().getMonth(),1),selected:new Date(new Date()).toDateString(),logs:store.get('logs',[]),custom:store.get('custom',[]),decks:store.get('decks',{}),last:store.get('last',{}),activeSession:store.get('activeSession',null),sessionSummary:null,brainFilter:null,brainTime:null,brainFavorites:store.get('brainFavorites',[]),brainCustom:store.get('brainCustom',[])};
const all=()=>[...seed,...state.custom]; const deck=(c)=>({...CATS[c],...(state.decks[c]||{})});const fmt=d=>new Intl.DateTimeFormat(undefined,{month:'long',day:'numeric',year:'numeric'}).format(new Date(d));const time=d=>new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(d));const dateKey=d=>new Date(d).toDateString();
function save(){store.set('logs',state.logs);store.set('custom',state.custom);store.set('decks',state.decks);store.set('last',state.last);store.set('activeSession',state.activeSession);store.set('brainFavorites',state.brainFavorites);store.set('brainCustom',state.brainCustom)}
function streaks(){let set=new Set(state.logs.map(x=>dateKey(x.at))),cur=0,best=0,run=0,d=new Date();d.setHours(0,0,0,0);while(set.has(d.toDateString())){cur++;d.setDate(d.getDate()-1)};let dates=[...set].map(x=>new Date(x)).sort((a,b)=>b-a);for(let x of dates){if(!best){best=1;run=1;continue}let prev=dates[dates.indexOf(x)-1];if(prev&&Math.round((prev-x)/864e5)===1)run++;else run=1;best=Math.max(best,run)}return{cur,best}}
function nav(){return `<nav class="nav"><button class="brand" onclick="go('home')">Aquarius</button><div class="tabs"><button class="tab ${state.page==='home'?'active':''}" onclick="go('home')">🏠 <b>Home</b></button><button class="tab ${state.page==='discover'?'active':''}" onclick="go('discover')">🃏 <b>Discover</b></button><button class="tab ${state.page==='journey'?'active':''}" onclick="go('journey')">📅 <b>Journey</b></button><button class="tab ${state.page==='cup'?'active':''}" onclick="go('cup')">🫙 <b>My Cup</b></button></div></nav>`}
function home(){let s=streaks(), recent=state.logs.slice().sort((a,b)=>b.at-a.at).slice(0,3);return `<section class="hero"><div class="hero-copy"><div class="eyebrow">${greeting()} 👋</div><h1>How are you filling<br>your cup today?</h1><p>Pick something small. Do something you enjoy. Keep showing up for yourself.</p></div><div class="streak"><span>🔥 Current streak</span><strong>${s.cur} ${s.cur===1?'day':'days'}</strong><small>${s.best?`Your best is ${s.best} days—lovely momentum.`:'Every little thing counts. Start whenever you’re ready.'}</small></div></section><div class="section-head"><div><h2>Choose a little adventure</h2><p>No pressure, just possibilities.</p></div><div class="time-filter">${[['5 min',5],['10 min',10],['20 min',20],['30 min',30],['1 hour+',60]].map(x=>`<button class="chip ${state.time===x[1]?'active':''}" onclick="setTime(${x[1]})">${x[0]}</button>`).join('')}<button class="chip" onclick="setTime(null)">Any time</button></div></div><div class="decks">${Object.keys(CATS).map(c=>deckCard(c)).join('')}</div><section class="surprise"><div><h2>✨ Surprise me</h2><p>Don't know what you feel like doing? Let chance be kind.</p></div><button class="primary" onclick="surprise()">Surprise me →</button></section><section class="recent"><div class="section-head" style="margin:0"><div><h2>A few little wins</h2><p>What you’ve made room for lately.</p></div><button class="secondary" onclick="go('journey')">See journey</button></div>${recent.length?recent.map(logRow).join(''):`<div class="empty">🌱 Your journey starts here.<br><small>You haven't filled your cup yet—draw your first card whenever you like.</small></div>`}</section>`}
function deckCard(c){let d=deck(c),n=all().filter(x=>x.category===c).length;return `<button class="deck" style="background:${d[2]}" onclick="openDeck('${c}')"><span class="emoji">${d[0]}</span><h3>${d.name||c}</h3><p>${d.description||d[1]}</p><span class="count">${n} cards</span></button>`}
function discover(){return `<div class="section-head"><div><div class="eyebrow">Discover</div><h2>Pick a deck, draw a moment.</h2><p>Each card is a small invitation for your day.</p></div></div><div class="decks">${Object.keys(CATS).map(deckCard).join('')}</div>`}
function deckPage(){let c=state.cat,d=deck(c),a=state.activity;return `<section class="deck-view"><button class="back" onclick="go('home')">← Back to all decks</button><div class="deck-title"><div class="emoji" style="font-size:36px">${d[0]}</div><h1>${d.name||c}</h1><p>${d.description||d[1]}</p>${state.time?`<p style="color:var(--green);font-weight:800">⏱ Showing ${timeLabel()} activities</p>`:''}</div><div class="flip-wrap"><div class="flip ${state.revealed?'revealed':''}"><article class="card front"><div class="big">🃏</div><h2>What will you do?</h2><p>Draw a little surprise from this deck.</p></article><article class="card back">${a?`<span class="tag">✨ TODAY'S LITTLE CHALLENGE</span><h2>${a.title}</h2><p>${a.description}</p><div class="details"><span>⏱ ~${a.estimatedDuration} min</span><span>🌱 ${a.difficulty}</span><span>${d[0]} ${a.category}</span></div>`:''}</article></div></div>${state.revealed?`<div class="card-actions"><button class="primary" onclick="complete()">I did it ✨</button><button class="secondary" onclick="draw()">Draw another</button></div>`:`<div class="card-actions"><button class="primary" onclick="draw()">Draw a card ✨</button></div>`}<button class="add-link" onclick="activityModal('${c}')">＋ Add activity</button><button class="add-link" onclick="manageModal('${c}')">Manage my activities</button><button class="add-link" onclick="deckModal('${c}')">Edit this deck</button></section>`}
function journey(){let m=state.month,days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),first=m.getDay(), selectedLogs=state.logs.filter(x=>dateKey(x.at)===state.selected);return `<div class="section-head"><div><div class="eyebrow">My Journey</div><h2>Your beautiful record</h2><p>Small moments add up to a life you get to remember.</p></div></div><div class="journey"><section class="panel"><div class="calendar-head"><button class="icon-btn" aria-label="Previous month" onclick="changeMonth(-1)">←</button><h2>${m.toLocaleString(undefined,{month:'long',year:'numeric'})}</h2><button class="icon-btn" aria-label="Next month" onclick="changeMonth(1)">→</button></div><div class="weekdays">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar">${Array(first).fill('<div class="day blank"></div>').join('')}${Array.from({length:days},(_,i)=>{let d=new Date(m.getFullYear(),m.getMonth(),i+1), n=state.logs.filter(x=>dateKey(x.at)===d.toDateString()).length;return `<button class="day ${state.selected===d.toDateString()?'selected':''}" onclick="selectDate('${d.toDateString()}')"><span class="n">${i+1}</span>${n?`<span class="dot" title="${n} activities"></span>`:''}</button>`}).join('')}</div></section><aside class="panel"><h3 class="detail-title">${fmt(state.selected)}</h3><p style="color:var(--muted);margin-top:0">${selectedLogs.length?`You filled your cup ${selectedLogs.length} ${selectedLogs.length===1?'time':'times'} today.`:'A quiet little page in your journey.'}</p>${selectedLogs.length?selectedLogs.sort((a,b)=>a.at-b.at).map(logRow).join(''):`<div class="empty">🌿 Nothing recorded here yet.</div>`}</aside></div><section class="panel" style="margin-top:20px"><div class="section-head" style="margin:0"><div><h2>Activity garden</h2><p>Each square is a day you showed up.</p></div></div>${heatmap()}</section><section class="panel" style="margin-top:20px"><h2 style="font:26px Georgia,serif;margin-top:0">Activity history</h2>${history()}</section>`}
function heatmap(){let today=new Date();today.setHours(0,0,0,0);let cells=[];for(let i=370;i>=0;i--){let d=new Date(today);d.setDate(today.getDate()-i);let n=state.logs.filter(x=>dateKey(x.at)===d.toDateString()).length;cells.push(`<button class="heat ${n>=4?'l3':n>=2?'l2':n?'l1':''}" aria-label="${fmt(d)}: ${n} activities" title="${fmt(d)} · ${n} activities" onclick="selectHeat('${d.toDateString()}')"></button>`)}return `<div class="heat-scroll"><div class="heat-labels"><span>Last year</span><span>Today</span></div><div class="heatmap">${cells.join('')}</div></div>`}
function history(){let groups={};state.logs.slice().sort((a,b)=>b.at-a.at).forEach(x=>(groups[dateKey(x.at)]??=[]).push(x));let keys=Object.keys(groups);return keys.length?keys.map(k=>`<div class="history-day"><h3>${relative(k)}</h3>${groups[k].map(logRow).join('')}</div>`).join(''):`<div class="empty">🌱 Your history will bloom here after your first card.</div>`}
function cup(){let now=new Date(),monthLogs=state.logs.filter(x=>new Date(x.at).getMonth()===now.getMonth()&&new Date(x.at).getFullYear()===now.getFullYear()),s=streaks(),mins=monthLogs.reduce((n,x)=>n+x.duration,0),counts=Object.keys(CATS).map(c=>[c,state.logs.filter(x=>x.category===c).length]);let fav=counts.slice().sort((a,b)=>b[1]-a[1])[0], last={};state.logs.forEach(x=>last[x.category]=Math.max(last[x.category]||0,x.at));let neglected=Object.keys(CATS).sort((a,b)=>(last[a]||0)-(last[b]||0))[0];let weekdays=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];let active=weekdays.map((x,i)=>[x,state.logs.filter(l=>new Date(l.at).getDay()===i).length]).sort((a,b)=>b[1]-a[1])[0];return `<div class="section-head"><div><div class="eyebrow">My Cup</div><h2>See what you've been giving your time to.</h2><p>Your life, in small colorful pieces.</p></div></div><div class="stats"><article class="stat"><b>${monthLogs.length}</b><small>activities this month</small></article><article class="stat"><b>${s.cur}</b><small>day streak</small></article><article class="stat"><b>${Math.floor(mins/60)}h ${mins%60}m</b><small>estimated time this month</small></article></div><section class="panel" style="margin-top:20px"><h2 style="font:26px Georgia,serif;margin-top:0">The things filling your cup</h2>${counts.map(([c,n])=>`<div>${deck(c)[0]} <b>${c}</b> <span style="color:var(--muted)">— ${n}</span><div class="bar"><i style="width:${Math.max(2,(n/Math.max(1,...counts.map(x=>x[1])))*100)}%"></i></div></div>`).join('')}</section><section class="insight"><div class="eyebrow">A gentle nudge</div><h2 style="font:25px Georgia,serif;margin:8px 0">${deck(neglected)[0]} Your cup might enjoy a little ${neglected}.</h2><p>${last[neglected]?`It’s been a little while since you picked a ${neglected.toLowerCase()} activity.`:`You haven't explored this deck yet—there might be a sweet surprise inside.`}</p><button class="primary" onclick="openDeck('${neglected}')">Give me one →</button></section><section class="panel" style="margin-top:20px"><h2 style="font:26px Georgia,serif;margin-top:0">Little insights</h2><p>Favorite category: <b>${fav[1]?fav[0]:'Waiting for your first adventure'}</b></p><p>Most active day: <b>${active[1]?active[0]:'To be discovered'}</b></p><p>Longest streak: <b>${s.best} days</b></p></section><section class="panel" style="margin-top:20px"><h2 style="font:26px Georgia,serif;margin-top:0">Your progress is saved</h2><p style="color:var(--muted)">Every completion is saved immediately on this device with its date and time. It stays in your Journey, history, heatmap, and stats tomorrow and beyond.</p><button class="secondary" onclick="downloadBackup()">Download a backup</button></section>`}
function logRow(x){return `<div class="log-row"><div class="log-icon">${deck(x.category)[0]}</div><div class="log-meta"><b>${x.title}</b><small>${time(x.at)} · ${x.category} · ${x.duration} min</small></div><button class="delete" aria-label="Delete ${x.title}" onclick="delLog('${x.id}')">×</button></div>`}
function greeting(){let h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}function relative(k){let d=new Date(k),today=new Date();return d.toDateString()===today.toDateString()?'Today':new Date(today-864e5).toDateString()===d.toDateString()?'Yesterday':fmt(d)}
function render(){let content=state.page==='home'?home():state.page==='discover'?discover():state.page==='deck'?deckPage():state.page==='journey'?journey():cup();document.getElementById('app').innerHTML=nav()+`<div class="page">${content}</div>`}function go(p){state.page=p;render()}function setTime(t){state.time=t;render()}function openDeck(c){state.cat=c;state.page='deck';state.activity=null;state.revealed=false;render()}function choices(c){let a=all().filter(x=>!c||x.category===c);if(state.time)a=a.filter(x=>state.time===60?x.estimatedDuration>=60:x.estimatedDuration<=state.time);return a}function timeLabel(){return state.time===60?'1 hour+':state.time?`${state.time} min`:'any amount of time'}function noMatch(){document.body.insertAdjacentHTML('beforeend',`<div class="toast" onclick="this.remove()"><div class="success"><div class="spark">⏱️</div><h2>No match just yet</h2><p>This deck has no activities for ${timeLabel()}. Choose another time or try Surprise Me.</p><div style="margin-top:20px"><button class="primary">Okay</button></div></div></div>`)}function draw(){let a=choices(state.cat);if(!a.length)return noMatch();let last=state.last[state.cat];if(a.length>1)a=a.filter(x=>x.id!==last);state.activity=a[Math.floor(Math.random()*a.length)];state.revealed=true;state.last[state.cat]=state.activity.id;save();render()}function surprise(){let a=choices(null);if(!a.length)return noMatch();state.activity=a[Math.floor(Math.random()*a.length)];state.cat=state.activity.category;state.revealed=true;state.page='deck';render()}function complete(){let a=state.activity;state.logs.push({id:crypto.randomUUID(),activityId:a.id,title:a.title,category:a.category,duration:a.estimatedDuration,at:Date.now()});save();let s=streaks();render();document.body.insertAdjacentHTML('beforeend',`<div class="toast" onclick="this.remove()"><div class="success"><div class="spark">✨</div><h2>You did it!</h2><p>Another little thing for yourself.</p><b>🔥 Current streak: ${s.cur} ${s.cur===1?'day':'days'}</b><div style="margin-top:20px"><button class="primary">Lovely</button></div></div></div>`)}function delLog(id){state.logs=state.logs.filter(x=>x.id!==id);save();render()}function changeMonth(n){state.month=new Date(state.month.getFullYear(),state.month.getMonth()+n,1);render()}function selectDate(d){state.selected=d;render()}function selectHeat(d){state.selected=d;state.month=new Date(new Date(d).getFullYear(),new Date(d).getMonth(),1);state.page='journey';render()}
function activityModal(c,existing){let a=existing||{title:'',description:'',estimatedDuration:10,difficulty:'Easy'};document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><form class="modal" onsubmit="saveActivity(event,'${c}','${existing?.id||''}')"><h2>${existing?'Edit':'Add'} an activity</h2><label class="field">Activity name<input required name="title" value="${a.title.replace(/"/g,'&quot;')}"></label><label class="field">Description<textarea name="description">${a.description}</textarea></label><label class="field">Estimated duration<select name="duration">${[5,10,15,20,30,45,60].map(n=>`<option ${a.estimatedDuration===n?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">Difficulty<select name="difficulty">${['Tiny','Easy','Medium'].map(x=>`<option ${a.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save activity</button></div></form></div>`)}function manageModal(c){let mine=state.custom.filter(x=>x.category===c);document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><div class="modal"><h2>My ${c} activities</h2>${mine.length?mine.map(x=>`<div class="log-row"><div class="log-meta"><b>${x.title}</b><small>${x.estimatedDuration} min · ${x.difficulty}</small></div><button class="secondary" onclick="closeModal();activityModal('${c}',state.custom.find(x=>x.id==='${x.id}'))">Edit</button><button class="delete" onclick="deleteActivity('${x.id}')">×</button></div>`).join(''):`<div class="empty">Your personal additions will live here.</div>`}<div class="modal-actions"><button class="secondary" onclick="closeModal()">Close</button><button class="primary" onclick="closeModal();activityModal('${c}')">＋ Add</button></div></div></div>`)}function deleteActivity(id){state.custom=state.custom.filter(x=>x.id!==id);save();closeModal();render();manageModal(state.cat)}function closeModal(){document.getElementById('modal')?.remove()}function saveActivity(e,c,id){e.preventDefault();let f=new FormData(e.target),obj={id:id||crypto.randomUUID(),title:f.get('title'),description:f.get('description'),estimatedDuration:+f.get('duration'),difficulty:f.get('difficulty'),category:c};if(id)state.custom=state.custom.map(x=>x.id===id?obj:x);else state.custom.push(obj);save();closeModal();render()}function deckModal(c){let d=deck(c);document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><form class="modal" onsubmit="saveDeck(event,'${c}')"><h2>Edit ${c} deck</h2><label class="field">Deck name<input name="name" value="${d.name||c}"></label><label class="field">Description<input name="description" value="${d.description||d[1]}"></label><label class="field">Icon / emoji<input name="emoji" value="${d[0]}"></label><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save deck</button></div></form></div>`)}function saveDeck(e,c){e.preventDefault();let f=new FormData(e.target),base=CATS[c];state.decks[c]={name:f.get('name'),description:f.get('description'),0:f.get('emoji'),1:base[1],2:base[2]};save();closeModal();render()}function downloadBackup(){let data=JSON.stringify({version:1,exportedAt:new Date().toISOString(),logs:state.logs,customActivities:state.custom,decks:state.decks},null,2),url=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=`aquarius-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)}render();
// Focus-session layer: timestamps, not interval ticks, are the source of truth.
var focusInterval;
function elapsedMs(s){let paused=s.totalPausedDuration||0;if(s.status==='paused'&&s.pausedAt)paused+=Date.now()-s.pausedAt;return Math.max(0,Date.now()-s.startTime-paused)}
function pad(n){return String(n).padStart(2,'0')}function clock(ms,plus=false){let t=Math.floor(ms/1000);return `${plus?'+':''}${pad(Math.floor(t/60))}:${pad(t%60)}`}
function setupModal(){let a=state.activity;document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><form class="modal" onsubmit="startFocus(event)"><h2>Ready?</h2><p style="font:22px Georgia,serif;margin:0">${a.title}</p><p style="color:var(--muted)">How long would you like to spend on this?</p><div class="time-filter">${[5,10,15,20,30,45,60].map(n=>`<label class="chip"><input type="radio" name="duration" value="${n}" ${a.estimatedDuration===n?'checked':''}> ${n} min</label>`).join('')}</div><label class="field">Custom duration (minutes)<input type="number" name="custom" min="1" max="480" placeholder="Optional"></label><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Not now</button><button class="primary">Start ✨</button></div></form></div>`)}
function complete(){setupModal()}
function startFocus(e){e.preventDefault();let form=new FormData(e.target),planned=+(form.get('custom')||form.get('duration'));if(!planned)return;let a=state.activity;state.activeSession={id:crypto.randomUUID(),activity:a,startTime:Date.now(),plannedDuration:planned,totalPausedDuration:0,pausedAt:null,status:'running',overtime:false};state.sessionSummary=null;state.page='focus';save();unlockSound();closeModal();render()}
function focusPage(){let s=state.activeSession;if(!s){let x=state.sessionSummary,st=streaks();return `<main class="focus"><div class="focus-inner"><section class="focus-card"><div style="font-size:58px">✨</div><div class="eyebrow">Session complete</div><h1>You filled your cup.</h1><p>${deck(x.category)[0]} <b>${x.title}</b></p><p>⏱ Planned: ${x.plannedDuration} min<br>⏱ Actual: ${x.actualDuration} min${x.overtime?'<br>+ Overtime':''}${!x.completedPlan?' · You still showed up for yourself.':''}</p><p>🔥 Current streak: ${st.cur} days</p><button class="primary" onclick="go('home')">Done</button><button class="secondary" onclick="openDeck('${x.category}')">Do another</button></section></div></main>`}let e=elapsedMs(s),planned=s.plannedDuration*60000,over=s.status==='overtime',done=s.status==='elapsed';if(done)return `<main class="focus"><div class="focus-inner"><section class="focus-card"><div style="font-size:58px">✨</div><div class="eyebrow">Time's up</div><h1>You showed up for yourself.</h1><p>Your ${s.plannedDuration}-minute session is complete.</p><button class="primary" onclick="finishSession()">✓ I'm Done</button><button class="secondary" onclick="keepGoing()">+ Keep Going</button></section></div></main>`;let remaining=Math.max(0,planned-e),display=over?clock(e-planned,true):clock(remaining),progress=over?100:Math.min(100,e/planned*100);return `<main class="focus ${over?'overtime':''}"><button class="sound" onclick="toggleSound()">${state.sound?'🔔 Sound on':'🔕 Sound off'}</button><div class="focus-inner"><div class="eyebrow">${deck(s.activity.category)[0]} ${s.activity.category}</div><h1>${s.activity.title}</h1><p class="focus-sub">${over?"You're still going. ✨":"Enjoy the process. There’s nowhere else you need to be right now."}</p><div class="ring" id="ring" style="--p:${progress}"><div class="timer" id="timer">${display}</div><div class="timer-label">${over?'⏱ Overtime':s.status==='paused'?'Paused':'Focus time'}</div></div><div class="focus-actions">${over?`<button class="primary" onclick="finishSession()">✓ Finish</button>`:`<button class="primary" onclick="togglePause()">${s.status==='paused'?'▶ Resume':'⏸ Pause'}</button>`}</div>${!over?'<button class="end-focus" onclick="endConfirm()">✕ End Session</button>':''}</div></main>`}
function updateFocus(){let s=state.activeSession;if(!s||s.status==='paused'||s.status==='elapsed')return clearInterval(focusInterval);let e=elapsedMs(s),planned=s.plannedDuration*60000;if(s.status==='running'&&e>=planned){s.status='elapsed';save();if(state.sound)softRing();render();return}let timer=document.getElementById('timer'),ring=document.getElementById('ring');if(timer){timer.textContent=s.status==='overtime'?clock(e-planned,true):clock(planned-e);ring.style.setProperty('--p',s.status==='overtime'?100:Math.min(100,e/planned*100))}}
function startTicker(){clearInterval(focusInterval);if(state.activeSession&&(state.activeSession.status==='running'||state.activeSession.status==='overtime')){updateFocus();focusInterval=setInterval(updateFocus,250)}}
function togglePause(){let s=state.activeSession;if(s.status==='paused'){s.totalPausedDuration+=(Date.now()-s.pausedAt);s.pausedAt=null;s.status='running'}else{s.pausedAt=Date.now();s.status='paused'}save();render()}
function keepGoing(){state.activeSession.status='overtime';state.activeSession.overtime=true;save();render()}
function endConfirm(){let s=state.activeSession,mins=Math.max(1,Math.round(elapsedMs(s)/60000));document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><div class="modal"><h2>Leave this session?</h2><p>You’ve already spent about ${mins} minutes on it. Every bit of time you gave yourself counts.</p><div class="modal-actions"><button class="secondary" onclick="closeModal()">Keep going</button><button class="primary" onclick="finishSession()">End & log</button></div></div></div>`)}
function finishSession(){let s=state.activeSession,e=elapsedMs(s),actual=Math.max(1,Math.round(e/60000)),completed=e>=s.plannedDuration*60000;let log={id:crypto.randomUUID(),activityId:s.activity.id,title:s.activity.title,category:s.activity.category,at:Date.now(),startTime:s.startTime,endTime:Date.now(),plannedDuration:s.plannedDuration,actualDuration:actual,actualSeconds:Math.round(e/1000),duration:actual,completedPlan:completed,overtime:s.overtime||e>s.plannedDuration*60000,status:completed?'completed':'stopped early'};state.logs.push(log);state.activeSession=null;state.sessionSummary=log;state.page='focus';save();closeModal();render()}
function unlockSound(){if(!state.sound)return;try{let A=window.AudioContext||window.webkitAudioContext;window.fmcAudio??=new A();window.fmcAudio.resume()}catch{}}
function softRing(){try{unlockSound();let c=window.fmcAudio,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(523.25,c.currentTime);o.frequency.exponentialRampToValueAtTime(783.99,c.currentTime+.55);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.07,c.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.8);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.85)}catch{}}
function toggleSound(){state.sound=!state.sound;save();render()}
function logRow(x){let details=x.plannedDuration?`${x.plannedDuration} min planned · ${x.actualDuration} min spent${x.overtime?' · + overtime':x.completedPlan?' · completed':' · stopped early'}`:`${x.duration} min`;return `<div class="log-row"><div class="log-icon">${deck(x.category)[0]}</div><div class="log-meta"><b>${x.title}</b><small>${time(x.at)} · ${x.category} · ${details}</small></div><button class="delete" aria-label="Delete ${x.title}" onclick="delLog('${x.id}')">×</button></div>`}
function render(){clearInterval(focusInterval);if(state.activeSession)state.page='focus';let focus=state.page==='focus',content=focus?focusPage():state.page==='home'?home():state.page==='discover'?discover():state.page==='deck'?deckPage():state.page==='journey'?journey():cup();document.getElementById('app').innerHTML=focus?content:nav()+`<div class="page">${content}</div>`;document.querySelectorAll('button[onclick="complete()"]').forEach(b=>b.textContent='✨ Do It');document.querySelector('.sound')?.remove();if(focus)startTicker()}
brainResources=[

const researchTopics=['Why do cats purr?','How does GPS know where you are?','Why is the sky blue?','How do airplanes stay in the air?','Why do onions make us cry?','How do ants find their way home?','How does noise-cancelling technology work?','Why do we have fingerprints?','How does a microwave heat food?','What would happen if Earth’s gravity became half as strong?'];
function brainAll(){return [...brainResources,...state.brainCustom]}
function brainStreak(){let logs=state.logs.filter(x=>x.category==='Brain Gym'),set=new Set(logs.map(x=>dateKey(x.at))),best=0,run=0,dates=[...set].map(x=>new Date(x)).sort((a,b)=>b-a);dates.forEach((d,i)=>{if(i&&Math.round((dates[i-1]-d)/864e5)===1)run++;else run=1;best=Math.max(best,run)});let cur=0,d=new Date();d.setHours(0,0,0,0);while(set.has(d.toDateString())){cur++;d.setDate(d.getDate()-1)}return{cur,best}}
function brainPage(){let resources=brainAll().filter(x=>(!state.brainFilter||x.category===state.brainFilter)&&(!state.brainTime||(state.brainTime===60?x.time>=60:x.time<=state.brainTime))),cats=['Logic & Puzzles','Strategy','Coding','Science','Explore & Research','Mathematics','Spatial Thinking','Creative Thinking','Memory','Language','Problem Solving','Mystery'],icons=['🧩','♟️','💻','🔬','🌎','🔢','🧊','🎨','🧠','🗣️','🧠','🔍'],logs=state.logs.filter(x=>x.category==='Brain Gym'),bs=brainStreak(),fav=state.brainFavorites.length;return `<section class="brain-hero"><div class="eyebrow">🧠 Brain Gym</div><h1>Give your brain something interesting to do.</h1><p>Curiosity, reasoning, and small problems worth thinking about.</p><button class="primary" onclick="brainSurprise()">🎲 Surprise My Brain</button> <button class="secondary" onclick="researchPrompt()">🌎 Random research</button></section><div class="section-head"><div><h2>What does your brain feel like doing?</h2><p>Choose a direction, or leave it open to browse.</p></div><button class="secondary" onclick="brainResourceModal()">＋ Add Brain Resource</button></div><div class="time-filter">${cats.map((c,i)=>`<button class="chip ${state.brainFilter===c?'active':''}" onclick="setBrainFilter('${c}')">${icons[i]} ${c.replace(' & Puzzles','')}</button>`).join('')}<button class="chip" onclick="setBrainFilter(null)">All</button></div><div class="section-head"><div><h2>⚡ Quick challenges</h2></div><div class="time-filter">${[5,10,20,30,60].map(n=>`<button class="chip ${state.brainTime===n?'active':''}" onclick="setBrainTime(${n})">${n===60?'1 hour+':n+' min'}</button>`).join('')}<button class="chip" onclick="setBrainTime(null)">Any time</button></div></div><div class="brain-grid">${resources.length?resources.map(brainCard).join(''):`<div class="empty">No brain activities match that little pocket of time. Try another filter.</div>`}</div><section class="panel brain-history"><div class="section-head" style="margin:0"><div><h2>🧠 Your Brain</h2><p>${logs.length} brain activities · ${logs.reduce((n,x)=>n+x.duration,0)} minutes of curious time · ${bs.best} day longest brain streak</p></div><button class="secondary" onclick="showShelf()">${fav?'♥':'♡'} My Brain Shelf</button></div>${logs.length?`<div class="brain-history">${logs.slice().sort((a,b)=>b.at-a.at).slice(0,5).map(logRow).join('')}</div>`:`<div class="empty">Your Brain Gym history will grow here after your first challenge.</div>`}</section>`}
function brainCard(x){let saved=state.brainFavorites.includes(x.id);return `<article class="brain-card"><div style="font-size:29px">${x.icon||'🧠'}</div><h3>${x.name}</h3><p>${x.description}</p><div class="meta">${x.category} · ${x.time} min · ${x.pricing||'Free'}</div><div class="card-actions"><button class="secondary" onclick="toggleBrainFavorite('${x.id}')">${saved?'♥ Saved':'♡ Save'}</button><button class="primary" onclick="startBrain('${x.id}')">${x.internal?'Do it →':'Explore →'}</button></div></article>`}
function setBrainFilter(x){state.brainFilter=x;render()}function setBrainTime(x){state.brainTime=x;render()}function brainItem(id){return brainAll().find(x=>x.id===id)}function startBrain(id){let x=brainItem(id);state.activity={id:'brain-'+x.id,title:x.name,description:x.description,category:'Brain Gym',brainCategory:x.category,estimatedDuration:x.time,difficulty:x.difficulty};if(x.url)window.open(x.url,'_blank','noopener');setupModal()}function brainSurprise(){let a=brainAll().filter(x=>!state.brainTime||(state.brainTime===60?x.time>=60:x.time<=state.brainTime));let x=a[Math.floor(Math.random()*a.length)];if(x)startBrain(x.id)}function researchPrompt(){let topic=researchTopics[Math.floor(Math.random()*researchTopics.length)];state.activity={id:'research-'+Date.now(),title:`Research: ${topic}`,description:`Spend 20 minutes investigating. Find three interesting facts, understand the underlying idea, then explain it in three simple sentences.`,category:'Brain Gym',brainCategory:'Explore & Research',estimatedDuration:20,difficulty:'Curious'};setupModal()}function toggleBrainFavorite(id){state.brainFavorites=state.brainFavorites.includes(id)?state.brainFavorites.filter(x=>x!==id):[...state.brainFavorites,id];save();render()}function showShelf(){let shelf=brainAll().filter(x=>state.brainFavorites.includes(x.id));document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><div class="modal"><h2>My Brain Shelf</h2>${shelf.length?shelf.map(x=>`<div class="log-row"><div class="log-icon">${x.icon||'🧠'}</div><div class="log-meta"><b>${x.name}</b><small>${x.category} · ${x.time} min</small></div><button class="primary" onclick="closeModal();startBrain('${x.id}')">Open</button></div>`).join(''):`<div class="empty">Save resources you want to return to.</div>`}<div class="modal-actions"><button class="secondary" onclick="closeModal()">Close</button></div></div></div>`)}function brainResourceModal(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><form class="modal" onsubmit="saveBrainResource(event)"><h2>Add Brain Resource</h2><label class="field">Name<input required name="name"></label><label class="field">URL<input required type="url" name="url" placeholder="https://"></label><label class="field">Description<textarea name="description"></textarea></label><label class="field">Category<select name="category">${['Strategy','Logic & Puzzles','Problem Solving','Coding','Explore & Research','Memory','Science','Mathematics','Spatial Thinking','Language','Creative Thinking','Mystery'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">Typical time (minutes)<select name="time">${[5,10,20,30,60].map(x=>`<option>${x}</option>`).join('')}</select></label><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save resource</button></div></form></div>`)}function saveBrainResource(e){e.preventDefault();let f=new FormData(e.target);state.brainCustom.push({id:crypto.randomUUID(),name:f.get('name'),url:f.get('url'),description:f.get('description')||'A personal brain resource.',category:f.get('category'),time:+f.get('time'),icon:'🧠',pricing:'Personal'});save();closeModal();render()}
function coffeeQr(){return `<section class="creator-support"><div class="creator-support-copy"><div class="note-icon">💌</div><h3>A Little Note from the Creator</h3><p>Thank you for spending a little time with Fill My Cup. If it brought some joy to your day, you can send a little kindness back my way. ✨</p></div><div class="creator-support-action"><button class="primary" type="button" onclick="coffeeModal()">☕ Buy Me a Coffee</button></div></section>`}
function coffeeModal(showQr=false){let support=showQr?'<img class="coffee-qr-preview" src="assets/developer-coffee-qr.jpeg" alt="UPI payment QR code"><p class="coffee-thanks">Thank you for filling my cup too! 💗</p>':'<button class="primary" type="button" onclick="showCoffeeQr()">☕ Buy Me a Coffee</button>';document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><section class="modal coffee-modal" role="dialog" aria-modal="true" aria-labelledby="coffee-title"><div style="font-size:42px">💌</div><h2 id="coffee-title">A Little Note from the Creator</h2><p class="coffee-message">If you enjoyed using <b>Fill My Cup</b> and it brought a little joy to your day, you can buy the developer a cup of coffee ☕💗.</p><p>It’s a small way to say thank you and support the time and love that went into creating this website.</p>${support}<div class="coffee-close"><button class="secondary" type="button" onclick="closeModal()">Close</button></div></section></div>`)}
function showCoffeeQr(){closeModal();coffeeModal(true)}
function nav(){return `<nav class="nav"><button class="brand" onclick="go('home')">Aquarius</button><div class="tabs"><button class="tab ${state.page==='home'?'active':''}" onclick="go('home')">🏠 <b>Home</b></button><button class="tab ${state.page==='discover'?'active':''}" onclick="go('discover')">🃏 <b>Discover</b></button><button class="tab ${state.page==='brain'?'active':''}" onclick="go('brain')">🧠 <b>Brain</b></button><button class="tab ${state.page==='journey'?'active':''}" onclick="go('journey')">📅 <b>Journey</b></button><button class="tab ${state.page==='cup'?'active':''}" onclick="go('cup')">🫙 <b>My Cup</b></button></div></nav>`}
function render(){clearInterval(focusInterval);if(state.activeSession)state.page='focus';let focus=state.page==='focus',content=focus?focusPage():state.page==='brain'?brainPage():state.page==='home'?home():state.page==='discover'?discover():state.page==='deck'?deckPage():state.page==='journey'?journey():cup();if(state.page==='cup')content+=coffeeQr();document.getElementById('app').innerHTML=focus?content:nav()+`<div class="page">${content}</div>`;document.querySelectorAll('button[onclick="complete()"]').forEach(b=>b.textContent='✨ Do It');document.querySelector('.sound')?.remove();if(focus)startTicker()}
function deckCard(c){if(c==='Brain Gym'){let n=brainAll().length;return `<button class="deck" style="background:#dbe4f6" onclick="go('brain')"><span class="emoji">🧠</span><h3>Brain Gym</h3><p>Feed your curiosity</p><span class="count">${n} challenges</span></button>`}let d=deck(c),n=all().filter(x=>x.category===c).length;return `<button class="deck" style="background:${d[2]}" onclick="openDeck('${c}')"><span class="emoji">${d[0]}</span><h3>${d.name||c}</h3><p>${d.description||d[1]}</p><span class="count">${n} cards</span></button>`}
render();
</script></body></html>
